<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑 리스트</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #9ca3af;
    --border: #e5e7eb;
    --accent: #10b981;
    --accent-dark: #059669;
    --danger: #ef4444;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827;
      --card: #1f2937;
      --text: #f3f4f6;
      --muted: #6b7280;
      --border: #374151;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    padding: 24px;
    align-self: flex-start;
  }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .summary { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }

  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button.add {
    padding: 0 18px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button.add:hover { background: var(--accent-dark); }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 4px;
    border-bottom: 1px solid var(--border);
  }
  li:last-child { border-bottom: none; }
  li input[type="checkbox"] {
    width: 20px; height: 20px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  li .name { flex: 1; word-break: break-word; cursor: pointer; }
  li.done .name { text-decoration: line-through; color: var(--muted); }
  li button.delete {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
  }
  li button.delete:hover { color: var(--danger); background: rgba(239,68,68,0.1); }

  .empty { text-align: center; color: var(--muted); padding: 32px 0; }
  .footer { display: flex; justify-content: flex-end; margin-top: 16px; }
  .footer button {
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.9rem;
  }
  .footer button:hover { color: var(--danger); }
</style>
</head>
<body>
  <main class="app">
    <h1>🛒 쇼핑 리스트</h1>
    <div class="summary" id="summary"></div>

    <form id="addForm">
      <input type="text" id="itemInput" placeholder="살 물건을 입력하세요" autocomplete="off" autofocus>
      <button type="submit" class="add">추가</button>
    </form>

    <ul id="list"></ul>
    <div class="empty" id="empty">아직 아이템이 없어요.</div>

    <div class="footer">
      <button id="clearDone">완료 항목 삭제</button>
    </div>
  </main>

<script>
  const STORAGE_KEY = 'shopping-list-items';
  const list = document.getElementById('list');
  const input = document.getElementById('itemInput');
  const empty = document.getElementById('empty');
  const summary = document.getElementById('summary');

  let items = load();

  function load() {
    try { const v = JSON.parse(localStorage.getItem(STORAGE_KEY)); return Array.isArray(v) ? v : []; }
    catch { return []; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch {}
  }

  function render() {
    list.innerHTML = '';
    items.forEach(item => {
      const li = document.createElement('li');
      if (item.done) li.classList.add('done');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = item.done;
      checkbox.addEventListener('change', () => toggle(item.id));

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = item.name;
      name.addEventListener('click', () => toggle(item.id));

      const del = document.createElement('button');
      del.className = 'delete';
      del.title = '삭제';
      del.textContent = '✕';
      del.addEventListener('click', () => remove(item.id));

      li.append(checkbox, name, del);
      list.appendChild(li);
    });

    const doneCount = items.filter(i => i.done).length;
    empty.style.display = items.length ? 'none' : 'block';
    summary.textContent = `전체 ${items.length}개 · 완료 ${doneCount}개 · 남음 ${items.length - doneCount}개`;
  }

  function add(name) {
    items.push({ id: Date.now() + Math.random(), name, done: false });
    save(); render();
  }
  function toggle(id) {
    const item = items.find(i => i.id === id);
    if (item) item.done = !item.done;
    save(); render();
  }
  function remove(id) {
    items = items.filter(i => i.id !== id);
    save(); render();
  }

  document.getElementById('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = input.value.trim();
    if (!name) return;
    add(name);
    input.value = '';
    input.focus();
  });

  document.getElementById('clearDone').addEventListener('click', () => {
    items = items.filter(i => !i.done);
    save(); render();
  });

  render();
</script>
</body>
</html>
