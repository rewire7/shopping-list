<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑 리스트</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #9ca3af;
    --border: #e5e7eb;
    --accent: #10b981;
    --accent-dark: #059669;
    --danger: #ef4444;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827;
      --card: #1f2937;
      --text: #f3f4f6;
      --muted: #6b7280;
      --border: #374151;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    padding: 24px;
    align-self: flex-start;
  }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .summary { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }

  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button.add {
    padding: 0 18px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button.add:hover { background: var(--accent-dark); }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 4px;
    border-bottom: 1px solid var(--border);
  }
  li:last-child { border-bottom: none; }
  li input[type="checkbox"] {
    width: 20px; height: 20px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  li .name { flex: 1; word-break: break-word; cursor: pointer; }
  li.done .name { text-decoration: line-through; color: var(--muted); }
  li button.delete {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
  }
  li button.delete:hover { color: var(--danger); background: rgba(239,68,68,0.1); }

  .empty { text-align: center; color: var(--muted); padding: 32px 0; }
  .footer { display: flex; justify-content: flex-end; margin-top: 16px; }
  .footer button {
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.9rem;
  }
  .footer button:hover { color: var(--danger); }
</style>
</head>
<body>
  <main class="app">
    <h1>🛒 쇼핑 리스트</h1>
    <div class="summary" id="summary"></div>

    <form id="addForm">
      <input type="text" id="itemInput" placeholder="살 물건을 입력하세요" autocomplete="off" autofocus>
      <button type="submit" class="add">추가</button>
    </form>

    <ul id="list"></ul>
    <div class="empty" id="empty">아직 아이템이 없어요.</div>

    <div class="footer">
      <button id="clearDone">완료 항목 삭제</button>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://yanufqrvmnjzzbohpnfq.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Aj8p_EXxccqeC1BrkoInWg_gFPhYT0T';
  const TABLE = 'shopping_items';
  const LEGACY_STORAGE_KEY = 'shopping-list-items';

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const list = document.getElementById('list');
  const input = document.getElementById('itemInput');
  const empty = document.getElementById('empty');
  const summary = document.getElementById('summary');

  let items = [];

  function showError(message, error) {
    console.error(message, error);
    summary.textContent = `⚠️ ${message}`;
  }

  async function load() {
    const { data, error } = await db.from(TABLE).select('id, name, done').order('created_at');
    if (error) return showError('목록을 불러오지 못했어요.', error);
    items = data;
    render();
  }

  // 예전 버전에서 로컬 스토리지에 저장한 항목을 DB로 한 번만 옮긴다.
  async function migrateLocalItems() {
    let legacy;
    try { legacy = JSON.parse(localStorage.getItem(LEGACY_STORAGE_KEY)); } catch { return; }
    if (!Array.isArray(legacy) || !legacy.length) return;
    const rows = legacy.map(i => ({ name: String(i.name), done: !!i.done }));
    const { error } = await db.from(TABLE).insert(rows);
    if (error) return showError('로컬 데이터 이전에 실패했어요.', error);
    try { localStorage.removeItem(LEGACY_STORAGE_KEY); } catch {}
  }

  function render() {
    list.innerHTML = '';
    items.forEach(item => {
      const li = document.createElement('li');
      if (item.done) li.classList.add('done');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = item.done;
      checkbox.addEventListener('change', () => toggle(item.id));

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = item.name;
      name.addEventListener('click', () => toggle(item.id));

      const del = document.createElement('button');
      del.className = 'delete';
      del.title = '삭제';
      del.textContent = '✕';
      del.addEventListener('click', () => remove(item.id));

      li.append(checkbox, name, del);
      list.appendChild(li);
    });

    const doneCount = items.filter(i => i.done).length;
    empty.style.display = items.length ? 'none' : 'block';
    summary.textContent = `전체 ${items.length}개 · 완료 ${doneCount}개 · 남음 ${items.length - doneCount}개`;
  }

  async function add(name) {
    const { data, error } = await db.from(TABLE).insert({ name }).select('id, name, done').single();
    if (error) return showError('항목을 추가하지 못했어요.', error);
    items.push(data);
    render();
  }
  async function toggle(id) {
    const item = items.find(i => i.id === id);
    if (!item) return;
    const { error } = await db.from(TABLE).update({ done: !item.done }).eq('id', id);
    if (error) return showError('상태를 바꾸지 못했어요.', error);
    item.done = !item.done;
    render();
  }
  async function remove(id) {
    const { error } = await db.from(TABLE).delete().eq('id', id);
    if (error) return showError('항목을 삭제하지 못했어요.', error);
    items = items.filter(i => i.id !== id);
    render();
  }

  document.getElementById('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = input.value.trim();
    if (!name) return;
    add(name);
    input.value = '';
    input.focus();
  });

  document.getElementById('clearDone').addEventListener('click', async () => {
    const doneIds = items.filter(i => i.done).map(i => i.id);
    if (!doneIds.length) return;
    const { error } = await db.from(TABLE).delete().in('id', doneIds);
    if (error) return showError('완료 항목을 삭제하지 못했어요.', error);
    items = items.filter(i => !i.done);
    render();
  });

  summary.textContent = '불러오는 중…';
  migrateLocalItems().then(load);
</script>
</body>
</html>
